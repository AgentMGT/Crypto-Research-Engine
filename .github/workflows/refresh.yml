name: Refresh research site

on:
  schedule:
    # 3x/day around 06:00, 14:00, 22:00 UTC. Off the top of the hour, when GitHub's
    # scheduler is busiest and delays or drops runs.
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build both editions
        env:
          # Optional. Without them the site still builds: no AI commentary,
          # and CoinGecko runs on the public rate limit.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -m engine.build all

      - name: Commit history snapshots
        # A failed history push must not stop the fresh pages from deploying.
        continue-on-error: true
        run: |
          git config user.name "research-engine"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Another scan may have pushed while this one ran (two Scan now clicks, or a
          # scan overlapping the schedule). Rebase onto it, keeping this run's snapshot.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
